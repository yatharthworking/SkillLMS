spring.application.name=SkillLMS

server.port=${SERVER_PORT:8901}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/soul}
client.redirect-url=${CLIENT_REDIRECT_URL:http://localhost:3000/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lmsdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lms123}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

management.endpoints.web.exposure.include=info,health,metrics

spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/views/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.main.allow-bean-definition-overriding=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

logging.file.path=${LOGGING_FILE_PATH:logs/}
logging.file.name=${LOGGING_FILE_NAME:logs/application-${PID}.log}

jwt.secretKey=${JWT_SECRETKEY:PtEVtEFIknIhoXzJ3BViqEIAO/S7vyTi+o/cBhsggX9OpRCJMkEgoygVHzLvlu2Q0Y/p26Th7sk6ASlmDfbgXw==}
jwt.expiryTime=${JWT_EXPIRY_TIME:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

spring.google.clientId=${SPRING_GOOGLE_CLIENT_ID:local-google-client-id}
spring.google.projectId=${SPRING_GOOGLE_PROJECT_ID:lms-project-local}
spring.google.clientSecret=${SPRING_GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.google.redirectUri=${SPRING_GOOGLE_REDIRECT_URI:http://localhost:8901/soul/}
spring.google.tokenUri=${SPRING_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:${SPRING_GOOGLE_CLIENT_ID:local-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:${SPRING_GOOGLE_CLIENT_SECRET:local-google-client-secret}}
spring.security.oauth2.client.registration.google.scope=openid, profile, email
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:http://localhost:8901/soul/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

server.file.upload.path=${SERVER_FILE_UPLOAD_PATH:${user.home}/uploads/}
cloud.bucket.name=${CLOUD_BUCKET_NAME:}
spring.file.path=${SPRING_FILE_PATH:}

spring.jackson.serialization.fail-on-empty-beans=false
